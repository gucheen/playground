<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="一个完全在浏览器本地运行的纯文本差异对比工具。">
  <title>文本 Diff · 纯文本差异对比</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #1f2328;
      --muted: #656d76;
      --paper: #f6f8fa;
      --panel: #ffffff;
      --line: #d0d7de;
      --accent: #16824c;
      --accent-dark: #116b3e;
      --added: #e6ffec;
      --added-strong: #abf2bc;
      --removed: #ffebe9;
      --removed-strong: #ffb8b0;
      --gutter: #f6f8fa;
    }

    * { box-sizing: border-box; }

    [hidden] { display: none !important; }

    body {
      min-width: 320px;
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Microsoft YaHei", monospace;
    }

    button, textarea, input { font: inherit; }

    button:focus-visible, textarea:focus-visible, input:focus-visible {
      outline: 3px solid rgba(20, 107, 75, 0.25);
      outline-offset: 2px;
    }

    .shell {
      width: 100%;
      margin: 0 auto;
      padding: 16px clamp(12px, 2vw, 24px) 18px;
    }

    .masthead {
      display: flex;
      align-items: center;
      gap: 20px;
      margin: 0 2px 12px;
    }

    h1 {
      margin: 0;
      font-size: 28px;
      font-weight: 750;
      letter-spacing: -0.035em;
      line-height: 1.2;
      white-space: nowrap;
    }

    h1 span { color: var(--accent); }

    .intro {
      max-width: none;
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    .workspace {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--panel);
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      min-height: 50px;
      padding: 6px 8px;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 253, 248, 0.92);
    }

    .toolbar-group { display: flex; align-items: center; gap: 8px; }
    .toolbar-group.options { margin-left: auto; }

    button {
      min-height: 34px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      color: var(--ink);
      cursor: pointer;
      font-size: 12px;
      font-weight: 650;
      transition: transform 120ms ease, border-color 120ms ease, background 120ms ease;
    }

    button:hover { border-color: #aaa9a2; background: #faf9f4; }
    button:active { transform: translateY(1px); }
    button:disabled { cursor: not-allowed; opacity: 0.45; }

    .primary {
      border-color: var(--accent);
      background: var(--accent);
      color: #fff;
    }

    .primary:hover { border-color: var(--accent-dark); background: var(--accent-dark); }

    .text-button {
      border-color: transparent;
      background: transparent;
      color: var(--muted);
    }

    .text-button:hover { border-color: var(--line); background: #f7f5ef; color: var(--ink); }

    .switch {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 6px;
      color: var(--muted);
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      user-select: none;
    }

    .switch input {
      width: 15px;
      height: 15px;
      margin: 0;
      accent-color: var(--accent);
    }

    .editors {
      display: grid;
      grid-template-columns: 1fr 1fr;
    }

    .editor { min-width: 0; }
    .editor + .editor { border-left: 1px solid var(--line); }

    .editor-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 36px;
      padding: 0 10px;
      border-bottom: 1px solid var(--line);
      background: #faf8f2;
    }

    .editor-title {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 750;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--removed-strong); }
    .editor:last-child .dot { background: var(--added-strong); }
    .count { color: var(--muted); font: 11px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace; }

    textarea {
      display: block;
      width: 100%;
      height: clamp(170px, 24vh, 240px);
      min-height: 150px;
      resize: vertical;
      padding: 11px 12px 14px;
      border: 0;
      border-radius: 0;
      background: var(--panel);
      color: var(--ink);
      caret-color: var(--accent);
      font: 12.5px/1.6 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      tab-size: 2;
    }

    textarea::placeholder { color: #a5aaa6; }
    textarea:focus { outline: 0; background: #fff; }

    .result-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      min-height: 44px;
      padding: 6px 10px;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      background: #faf8f2;
    }

    .result-panel {
      position: relative;
      background: #fff;
    }

    .result-panel.is-fullscreen {
      display: flex;
      position: fixed;
      z-index: 1000;
      inset: 0;
      width: 100vw;
      height: 100vh;
      flex-direction: column;
      background: #fff;
    }

    .result-panel.is-fullscreen .result-head {
      flex: 0 0 auto;
      border-top: 0;
    }

    .result-panel.is-fullscreen .diff-wrap {
      height: auto;
      min-height: 0;
      flex: 1 1 auto;
    }

    body.result-fullscreen { overflow: hidden; }

    .result-label { font-size: 13px; font-weight: 750; }

    .result-tools {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 7px;
    }

    .select-all {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 0 3px;
      color: var(--muted);
      cursor: pointer;
      font-size: 11px;
      font-weight: 650;
      white-space: nowrap;
    }

    .select-all input,
    .row-select input {
      width: 14px;
      height: 14px;
      margin: 0;
      accent-color: var(--accent);
    }

    .select-all:has(input:disabled) { cursor: not-allowed; opacity: 0.45; }

    .merge-all {
      min-height: 28px;
      padding: 0 8px;
      background: #fff;
      color: var(--muted);
      font-size: 11px;
    }

    .summary {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 5px;
    }

    .result-meta {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
    }

    .fullscreen-button {
      min-height: 28px;
      padding: 0 9px;
      white-space: nowrap;
    }

    .badge {
      padding: 3px 7px;
      border-radius: 5px;
      background: #eceae3;
      color: var(--muted);
      font: 700 11px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    .badge.add { background: var(--added); color: #286441; }
    .badge.remove { background: var(--removed); color: #934a40; }
    .badge.modify { background: #efe8d8; color: #7b6330; }

    .diff-wrap {
      height: clamp(260px, 42vh, 540px);
      overflow: auto;
      background: #fff;
    }

    .result-panel.has-results .diff-wrap {
      height: clamp(360px, 58vh, 720px);
    }

    .diff-table {
      display: grid;
      grid-template-columns: 42px minmax(300px, 1fr) 72px 42px minmax(300px, 1fr);
      min-width: 832px;
      font: 12px/1.6 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    .cell {
      min-height: 25px;
      padding: 3px 8px;
      border-bottom: 1px solid rgba(217, 214, 206, 0.45);
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .number {
      padding-right: 7px;
      background: var(--gutter);
      color: #959b97;
      text-align: right;
      user-select: none;
    }

    .content-left { border-right: 1px solid var(--line); }
    .merge-cell {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 2px;
      padding: 2px;
      border-right: 1px solid var(--line);
      border-bottom: 1px solid rgba(217, 214, 206, 0.45);
      background: #f7f6f1;
    }

    .row-select {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 18px;
      height: 20px;
      cursor: pointer;
    }

    .merge-button {
      width: 20px;
      min-height: 20px;
      padding: 0;
      border-color: transparent;
      border-radius: 4px;
      background: transparent;
      color: var(--muted);
      font-size: 14px;
      line-height: 1;
    }

    .merge-button:hover {
      border-color: var(--line);
      background: #fff;
      color: var(--accent-dark);
    }
    .deleted { background: var(--removed); }
    .inserted { background: var(--added); }
    .empty-cell { background: #f7f6f1; color: #bbb; }
    .inline-del { border-radius: 3px; background: var(--removed-strong); }
    .inline-add { border-radius: 3px; background: var(--added-strong); }

    .empty-state {
      display: grid;
      place-items: center;
      height: 100%;
      min-height: 260px;
      padding: 24px 16px;
      color: var(--muted);
      text-align: center;
    }

    .empty-state strong {
      display: block;
      margin-bottom: 7px;
      color: var(--ink);
      font-size: 17px;
      font-weight: 700;
    }

    .privacy {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin: 8px 2px 0;
      color: var(--muted);
      font-size: 11px;
    }

    kbd {
      padding: 2px 5px;
      border: 1px solid var(--line);
      border-bottom-width: 2px;
      border-radius: 4px;
      background: #fbfaf6;
      font: inherit;
    }

    h1 {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 23px;
      font-weight: 700;
      letter-spacing: -0.04em;
    }

    h1::before { color: var(--accent); content: ">_ "; }

    .intro { font-size: 12px; }

    .workspace {
      border-radius: 2px;
      background: var(--panel);
    }

    .toolbar { background: #f6f8fa; }

    button {
      border-radius: 2px;
      background: #fff;
      color: var(--ink);
      font-family: inherit;
      font-weight: 600;
    }

    button:hover { border-color: var(--accent); background: #eef1f4; color: var(--accent-dark); }
    .primary { border-color: var(--accent); background: var(--accent); color: #fff; }
    .primary:hover { border-color: var(--accent-dark); background: var(--accent-dark); color: #fff; }
    .text-button { color: var(--muted); }
    .text-button:hover { border-color: var(--line); background: #eef1f4; color: var(--accent-dark); }
    .switch input, .select-all input, .row-select input { accent-color: var(--accent); }

    .editor-head, .result-head { background: #f6f8fa; }
    .dot { border-radius: 0; background: #cf4b4b; }
    .editor:last-child .dot { background: var(--accent); }

    textarea, textarea:focus { background: var(--panel); color: var(--ink); }
    textarea::placeholder { color: #535d68; }

    .result-panel, .diff-wrap { background: var(--panel); }
    .result-panel.is-fullscreen { background: var(--paper); }
    .merge-all { background: #fff; }
    .badge { border: 1px solid var(--line); border-radius: 2px; background: #fff; }
    .badge.add { border-color: #8ed59f; background: var(--added); color: #13743f; }
    .badge.remove { border-color: #f0aaa4; background: var(--removed); color: #b4232f; }
    .badge.modify { border-color: #dac36a; background: #fff8c5; color: #765a00; }

    .cell { border-bottom-color: rgba(208, 215, 222, 0.7); }
    .merge-cell, .empty-cell { background: #f6f8fa; }
    .merge-button:hover { background: #eef1f4; color: var(--accent-dark); }
    .inline-del, .inline-add { border-radius: 0; }

    kbd { border-radius: 2px; background: #fff; }

    @media (max-width: 760px) {
      .shell { padding: 10px 8px 14px; }
      .masthead { display: block; }
      .intro { margin-top: 4px; }
      .toolbar-group.options { width: 100%; margin-left: 0; border-top: 1px solid var(--line); padding-top: 7px; }
      .editors { grid-template-columns: 1fr; }
      .editor + .editor { border-top: 1px solid var(--line); border-left: 0; }
      textarea { height: 150px; min-height: 130px; }
      .diff-wrap { height: 310px; }
      .result-panel.has-results .diff-wrap { height: 430px; }
      .result-head { align-items: flex-start; flex-direction: column; gap: 7px; }
      .result-tools { width: 100%; flex-wrap: wrap; }
      .result-meta { width: 100%; justify-content: space-between; }
      .summary { justify-content: flex-start; }
      .privacy { align-items: flex-start; flex-direction: column; gap: 6px; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { scroll-behavior: auto !important; transition: none !important; }
    }
  </style>

<body class="pg-text-diff">
  <main class="shell">
    <header class="masthead">
      <h1>文本 <span>Diff</span></h1>
      <p class="intro">把两个版本放在一起，变化会自动浮现。逐行比较，并在修改行内精确标出增删内容。</p>
    </header>

    <section class="workspace" aria-label="文本差异对比工具">
      <div class="toolbar">
        <div class="toolbar-group">
          <button class="primary" id="compare" type="button">开始对比</button>
          <button id="swap" type="button" title="交换左右文本">⇄&nbsp; 交换</button>
        </div>
        <div class="toolbar-group">
          <button class="text-button" id="sample" type="button">载入示例</button>
          <button class="text-button" id="clear" type="button">清空</button>
        </div>
        <div class="toolbar-group options" aria-label="对比选项">
          <label class="switch"><input id="ignore-space" type="checkbox">忽略空白差异</label>
          <label class="switch"><input id="ignore-case" type="checkbox">忽略大小写</label>
        </div>
      </div>

      <div class="editors">
        <div class="editor">
          <div class="editor-head">
            <span class="editor-title"><span class="dot"></span>原始文本</span>
            <span class="count" id="left-count">0 行 · 0 字符</span>
          </div>
          <textarea id="left-text" spellcheck="false" aria-label="原始文本" placeholder="在这里粘贴原始文本…"></textarea>
        </div>
        <div class="editor">
          <div class="editor-head">
            <span class="editor-title"><span class="dot"></span>新文本</span>
            <span class="count" id="right-count">0 行 · 0 字符</span>
          </div>
          <textarea id="right-text" spellcheck="false" aria-label="新文本" placeholder="在这里粘贴修改后的文本…"></textarea>
        </div>
      </div>

      <section class="result-panel" id="result-panel" aria-label="对比结果面板">
        <div class="result-head">
          <div class="result-tools">
            <span class="result-label">对比结果</span>
            <label class="select-all"><input id="select-all" type="checkbox" disabled>全选差异</label>
            <button class="merge-all" id="merge-selected-left" type="button" disabled>← 已选应用到左侧</button>
            <button class="merge-all" id="merge-selected-right" type="button" disabled>已选应用到右侧 →</button>
            <button class="merge-all" id="accept-left" type="button" disabled>全部采用左侧 →</button>
            <button class="merge-all" id="accept-right" type="button" disabled>← 全部采用右侧</button>
            <button class="merge-all" id="undo-merge" type="button" disabled>撤销合并</button>
          </div>
          <div class="result-meta">
            <div class="summary" id="summary" aria-live="polite">
              <span class="badge">等待对比</span>
            </div>
            <button class="fullscreen-button" id="toggle-fullscreen" type="button" aria-pressed="false">⛶ 全屏查看</button>
          </div>
        </div>

        <div class="diff-wrap" id="diff-wrap">
          <div class="empty-state" id="empty-state">
            <div><strong>差异会显示在这里</strong>输入两段文本，然后点击“开始对比”</div>
          </div>
          <div class="diff-table" id="diff-table" hidden aria-label="文本差异结果"></div>
        </div>
      </section>
    </section>

    <footer class="privacy">
      <span>● 所有内容仅在当前浏览器中处理，不会上传。</span>
      <span><kbd>Ctrl</kbd> / <kbd>⌘</kbd> + <kbd>Enter</kbd> 快速对比</span>
    </footer>
  </main>

  <script>
    (() => {
      const $ = (selector) => document.querySelector(selector);
      const left = $('#left-text');
      const right = $('#right-text');
      const table = $('#diff-table');
      const emptyState = $('#empty-state');
      const resultPanel = $('#result-panel');
      const summary = $('#summary');
      const ignoreSpace = $('#ignore-space');
      const ignoreCase = $('#ignore-case');
      const selectAll = $('#select-all');
      const mergeSelectedLeft = $('#merge-selected-left');
      const mergeSelectedRight = $('#merge-selected-right');
      const acceptLeft = $('#accept-left');
      const acceptRight = $('#accept-right');
      const undoMerge = $('#undo-merge');
      const toggleFullscreen = $('#toggle-fullscreen');
      let debounceTimer;
      let hasCompared = false;
      let currentRows = [];
      let history = [];
      const selectedRows = new Set();

      const escapeHtml = (value) => String(value)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');

      function lineCount(text) {
        return text.length ? text.split('\n').length : 0;
      }

      function splitLines(text) {
        const normalized = text.replace(/\r\n?/g, '\n');
        return normalized === '' ? [] : normalized.split('\n');
      }

      function updateMergeControls(canMerge = left.value !== right.value) {
        acceptLeft.disabled = !canMerge;
        acceptRight.disabled = !canMerge;
        undoMerge.disabled = history.length === 0;
      }

      function updateSelectionControls() {
        const changeRows = currentRows
          .map((row, index) => row.type === 'equal' ? null : index)
          .filter((index) => index !== null);
        const selectedCount = selectedRows.size;

        table.querySelectorAll('.row-checkbox').forEach((checkbox) => {
          checkbox.checked = selectedRows.has(Number(checkbox.dataset.row));
        });
        selectAll.disabled = changeRows.length === 0;
        selectAll.checked = changeRows.length > 0 && selectedCount === changeRows.length;
        selectAll.indeterminate = selectedCount > 0 && selectedCount < changeRows.length;
        mergeSelectedLeft.disabled = selectedCount === 0;
        mergeSelectedRight.disabled = selectedCount === 0;
      }

      function pushHistory() {
        history.push({ left: left.value, right: right.value });
        if (history.length > 30) history.shift();
        updateMergeControls();
      }

      function updateCounts() {
        $('#left-count').textContent = `${lineCount(left.value)} 行 · ${left.value.length} 字符`;
        $('#right-count').textContent = `${lineCount(right.value)} 行 · ${right.value.length} 字符`;
        $('#clear').disabled = !left.value && !right.value;
      }

      function normalize(value) {
        let output = value;
        if (ignoreSpace.checked) output = output.replace(/\s+/g, ' ').trim();
        if (ignoreCase.checked) output = output.toLocaleLowerCase();
        return output;
      }

      function diffSequence(a, b, comparator = (x, y) => x === y) {
        const n = a.length;
        const m = b.length;
        const max = n + m;
        let frontier = new Map([[1, 0]]);
        const trace = [];

        for (let distance = 0; distance <= max; distance += 1) {
          trace.push(new Map(frontier));
          for (let diagonal = -distance; diagonal <= distance; diagonal += 2) {
            const down = frontier.get(diagonal + 1) ?? -Infinity;
            const across = frontier.get(diagonal - 1) ?? -Infinity;
            let x;
            if (diagonal === -distance || (diagonal !== distance && across < down)) {
              x = down;
            } else {
              x = across + 1;
            }
            let y = x - diagonal;
            while (x < n && y < m && comparator(a[x], b[y])) {
              x += 1;
              y += 1;
            }
            frontier.set(diagonal, x);
            if (x >= n && y >= m) return backtrack(trace, a, b, distance);
          }
        }
        return [];
      }

      function backtrack(trace, a, b, distance) {
        let x = a.length;
        let y = b.length;
        const result = [];

        for (let d = distance; d >= 0; d -= 1) {
          const frontier = trace[d];
          const diagonal = x - y;
          const down = frontier.get(diagonal + 1) ?? -Infinity;
          const across = frontier.get(diagonal - 1) ?? -Infinity;
          const previousDiagonal = diagonal === -d || (diagonal !== d && across < down)
            ? diagonal + 1
            : diagonal - 1;
          const previousX = frontier.get(previousDiagonal) ?? 0;
          const previousY = previousX - previousDiagonal;

          while (x > previousX && y > previousY) {
            result.push({ type: 'equal', left: a[x - 1], right: b[y - 1] });
            x -= 1;
            y -= 1;
          }

          if (d === 0) break;
          if (x === previousX) {
            result.push({ type: 'insert', right: b[y - 1] });
            y -= 1;
          } else {
            result.push({ type: 'delete', left: a[x - 1] });
            x -= 1;
          }
        }
        return result.reverse();
      }

      function tokenize(value) {
        return value.match(/\s+|[\p{L}\p{N}_]+|[^\s\p{L}\p{N}_]/gu) || [];
      }

      function inlineDiff(oldLine, newLine) {
        if (oldLine.length + newLine.length > 10000) {
          return {
            oldHtml: `<span class="inline-del">${escapeHtml(oldLine)}</span>`,
            newHtml: `<span class="inline-add">${escapeHtml(newLine)}</span>`
          };
        }

        const pieces = diffSequence(tokenize(oldLine), tokenize(newLine), (a, b) => normalize(a) === normalize(b));
        let oldHtml = '';
        let newHtml = '';
        for (const piece of pieces) {
          if (piece.type === 'equal') {
            oldHtml += escapeHtml(piece.left);
            newHtml += escapeHtml(piece.right);
          } else if (piece.type === 'delete') {
            oldHtml += `<span class="inline-del">${escapeHtml(piece.left)}</span>`;
          } else {
            newHtml += `<span class="inline-add">${escapeHtml(piece.right)}</span>`;
          }
        }
        return { oldHtml, newHtml };
      }

      function toRows(operations) {
        const rows = [];
        let leftNumber = 1;
        let rightNumber = 1;
        let index = 0;

        while (index < operations.length) {
          if (operations[index].type === 'equal') {
            const operation = operations[index];
            rows.push({
              type: 'equal',
              left: operation.left,
              right: operation.right,
              leftNumber,
              rightNumber,
              leftIndex: leftNumber - 1,
              rightIndex: rightNumber - 1
            });
            leftNumber += 1;
            rightNumber += 1;
            index += 1;
            continue;
          }

          const deleted = [];
          const inserted = [];
          while (index < operations.length && operations[index].type !== 'equal') {
            if (operations[index].type === 'delete') deleted.push(operations[index].left);
            if (operations[index].type === 'insert') inserted.push(operations[index].right);
            index += 1;
          }

          const blockLength = Math.max(deleted.length, inserted.length);
          for (let offset = 0; offset < blockLength; offset += 1) {
            const oldLine = deleted[offset];
            const newLine = inserted[offset];
            const type = oldLine !== undefined && newLine !== undefined
              ? 'modify'
              : oldLine !== undefined ? 'delete' : 'insert';
            const leftLineNumber = oldLine === undefined ? null : leftNumber;
            const rightLineNumber = newLine === undefined ? null : rightNumber;
            rows.push({
              type,
              left: oldLine,
              right: newLine,
              leftNumber: leftLineNumber,
              rightNumber: rightLineNumber,
              leftIndex: leftNumber - 1,
              rightIndex: rightNumber - 1
            });
            if (oldLine !== undefined) leftNumber += 1;
            if (newLine !== undefined) rightNumber += 1;
          }
        }
        return rows;
      }

      function renderRow(row, rowIndex) {
        let leftHtml = row.left === undefined ? '' : escapeHtml(row.left);
        let rightHtml = row.right === undefined ? '' : escapeHtml(row.right);
        if (row.type === 'modify') {
          const inline = inlineDiff(row.left, row.right);
          leftHtml = inline.oldHtml;
          rightHtml = inline.newHtml;
        }

        const leftClass = row.type === 'delete' || row.type === 'modify' ? ' deleted' : row.left === undefined ? ' empty-cell' : '';
        const rightClass = row.type === 'insert' || row.type === 'modify' ? ' inserted' : row.right === undefined ? ' empty-cell' : '';
        const mergeButtons = row.type === 'equal' ? '' : `
          <label class="row-select" title="选择此差异">
            <input class="row-checkbox" type="checkbox" data-row="${rowIndex}" aria-label="选择第 ${rowIndex + 1} 行差异">
          </label>
          <button class="merge-button" type="button" data-target="left" data-row="${rowIndex}" title="采用右侧内容" aria-label="将此差异应用到左侧">←</button>
          <button class="merge-button" type="button" data-target="right" data-row="${rowIndex}" title="采用左侧内容" aria-label="将此差异应用到右侧">→</button>`;
        return `
          <div class="cell number${leftClass}">${row.leftNumber ?? ''}</div>
          <div class="cell content-left${leftClass}">${leftHtml || (row.left === '' ? '&nbsp;' : '')}</div>
          <div class="merge-cell">${mergeButtons}</div>
          <div class="cell number${rightClass}">${row.rightNumber ?? ''}</div>
          <div class="cell${rightClass}">${rightHtml || (row.right === '' ? '&nbsp;' : '')}</div>`;
      }

      function mergeRows(rowIndexes, target) {
        const rows = rowIndexes
          .map((rowIndex) => ({ rowIndex, row: currentRows[rowIndex] }))
          .filter(({ row }) => row && row.type !== 'equal')
          .sort((a, b) => b.rowIndex - a.rowIndex);
        if (rows.length === 0) return;
        const leftLines = splitLines(left.value);
        const rightLines = splitLines(right.value);
        pushHistory();

        for (const { row } of rows) {
          if (target === 'left') {
            if (row.right === undefined) {
              leftLines.splice(row.leftIndex, 1);
            } else if (row.left === undefined) {
              leftLines.splice(row.leftIndex, 0, row.right);
            } else {
              leftLines[row.leftIndex] = row.right;
            }
          } else {
            if (row.left === undefined) {
              rightLines.splice(row.rightIndex, 1);
            } else if (row.right === undefined) {
              rightLines.splice(row.rightIndex, 0, row.left);
            } else {
              rightLines[row.rightIndex] = row.left;
            }
          }
        }

        if (target === 'left') {
          left.value = leftLines.join('\n');
        } else {
          right.value = rightLines.join('\n');
        }

        selectedRows.clear();
        updateCounts();
        compare();
      }

      function mergeRow(rowIndex, target) {
        mergeRows([rowIndex], target);
      }

      function isResultFullscreen() {
        return resultPanel.classList.contains('is-fullscreen');
      }

      function updateFullscreenControl() {
        const active = isResultFullscreen();
        toggleFullscreen.textContent = active ? '退出全屏' : '⛶ 全屏查看';
        toggleFullscreen.setAttribute('aria-pressed', String(active));
      }

      function leaveResultFullscreen() {
        resultPanel.classList.remove('is-fullscreen');
        document.body.classList.remove('result-fullscreen');
        updateFullscreenControl();
      }

      function toggleResultFullscreen() {
        if (resultPanel.classList.contains('is-fullscreen')) {
          leaveResultFullscreen();
          return;
        }
        resultPanel.classList.add('is-fullscreen');
        document.body.classList.add('result-fullscreen');
        updateFullscreenControl();
      }

      function compare() {
        const leftValue = left.value.replace(/\r\n?/g, '\n');
        const rightValue = right.value.replace(/\r\n?/g, '\n');
        hasCompared = true;

        if (!leftValue && !rightValue) {
          currentRows = [];
          selectedRows.clear();
          resultPanel.classList.remove('has-results');
          table.hidden = true;
          emptyState.hidden = false;
          emptyState.innerHTML = '<div><strong>先放入两段文本</strong>粘贴内容后，就可以开始对比</div>';
          summary.innerHTML = '<span class="badge">等待文本</span>';
          updateMergeControls(false);
          updateSelectionControls();
          return;
        }

        const leftLines = leftValue === '' ? [] : leftValue.split('\n');
        const rightLines = rightValue === '' ? [] : rightValue.split('\n');
        const operations = diffSequence(leftLines, rightLines, (a, b) => normalize(a) === normalize(b));
        const rows = toRows(operations);
        currentRows = rows;
        const counts = rows.reduce((total, row) => {
          if (row.type !== 'equal') total[row.type] += 1;
          return total;
        }, { insert: 0, delete: 0, modify: 0 });
        const changed = counts.insert + counts.delete + counts.modify;

        selectedRows.clear();
        table.innerHTML = rows.map(renderRow).join('');
        table.hidden = false;
        emptyState.hidden = true;
        resultPanel.classList.add('has-results');
        summary.innerHTML = changed === 0
          ? '<span class="badge add">✓ 两段文本一致</span>'
          : `<span class="badge modify">~ ${counts.modify} 行修改</span>
             <span class="badge remove">− ${counts.delete} 行删除</span>
             <span class="badge add">+ ${counts.insert} 行新增</span>`;
        updateMergeControls(left.value !== right.value);
        updateSelectionControls();
      }

      function scheduleCompare() {
        history = [];
        selectedRows.clear();
        updateCounts();
        updateMergeControls();
        updateSelectionControls();
        if (!hasCompared) return;
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(compare, 220);
      }

      left.addEventListener('input', scheduleCompare);
      right.addEventListener('input', scheduleCompare);
      left.addEventListener('scroll', () => { right.scrollTop = left.scrollTop; });
      right.addEventListener('scroll', () => { left.scrollTop = right.scrollTop; });
      $('#compare').addEventListener('click', compare);

      table.addEventListener('click', (event) => {
        const button = event.target.closest('.merge-button');
        if (!button) return;
        mergeRow(Number(button.dataset.row), button.dataset.target);
      });

      table.addEventListener('change', (event) => {
        const checkbox = event.target.closest('.row-checkbox');
        if (!checkbox) return;
        const rowIndex = Number(checkbox.dataset.row);
        if (checkbox.checked) {
          selectedRows.add(rowIndex);
        } else {
          selectedRows.delete(rowIndex);
        }
        updateSelectionControls();
      });

      selectAll.addEventListener('change', () => {
        selectedRows.clear();
        if (selectAll.checked) {
          currentRows.forEach((row, index) => {
            if (row.type !== 'equal') selectedRows.add(index);
          });
        }
        updateSelectionControls();
      });

      mergeSelectedLeft.addEventListener('click', () => mergeRows([...selectedRows], 'left'));
      mergeSelectedRight.addEventListener('click', () => mergeRows([...selectedRows], 'right'));

      acceptLeft.addEventListener('click', () => {
        if (left.value === right.value) return;
        pushHistory();
        right.value = left.value;
        updateCounts();
        compare();
      });

      acceptRight.addEventListener('click', () => {
        if (left.value === right.value) return;
        pushHistory();
        left.value = right.value;
        updateCounts();
        compare();
      });

      undoMerge.addEventListener('click', () => {
        const previous = history.pop();
        if (!previous) return;
        left.value = previous.left;
        right.value = previous.right;
        updateCounts();
        compare();
      });

      $('#swap').addEventListener('click', () => {
        [left.value, right.value] = [right.value, left.value];
        history = [];
        updateCounts();
        if (hasCompared) compare();
      });

      $('#clear').addEventListener('click', () => {
        left.value = '';
        right.value = '';
        hasCompared = false;
        currentRows = [];
        history = [];
        selectedRows.clear();
        resultPanel.classList.remove('has-results');
        updateCounts();
        table.hidden = true;
        table.innerHTML = '';
        emptyState.hidden = false;
        emptyState.innerHTML = '<div><strong>差异会显示在这里</strong>输入两段文本，然后点击“开始对比”</div>';
        summary.innerHTML = '<span class="badge">等待对比</span>';
        updateMergeControls(false);
        updateSelectionControls();
        left.focus();
      });

      $('#sample').addEventListener('click', () => {
        history = [];
        left.value = `产品更新说明\n\n我们优化了搜索速度。\n现在支持导出 PDF 文件。\n感谢每一位用户的反馈。`;
        right.value = `产品更新说明\n\n我们大幅优化了搜索速度。\n现在支持导出 PDF 和 Word 文件。\n新增：深色模式将在下月上线。\n感谢每一位用户的建议。`;
        updateCounts();
        compare();
      });

      [ignoreSpace, ignoreCase].forEach((control) => control.addEventListener('change', () => {
        if (hasCompared) compare();
      }));

      toggleFullscreen.addEventListener('click', toggleResultFullscreen);

      document.addEventListener('keydown', (event) => {
        if ((event.ctrlKey || event.metaKey) && event.key === 'Enter') {
          event.preventDefault();
          compare();
        } else if (event.key === 'Escape' && resultPanel.classList.contains('is-fullscreen')) {
          leaveResultFullscreen();
        }
      });

      updateCounts();
      updateSelectionControls();
    })();
  </script>
</body>
</html>
