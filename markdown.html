<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="在浏览器本地将标准 Markdown、Cursor 与 Codex 输出转换为 HTML。">
  <title>Markdown 转 HTML</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #1f2328;
      --muted: #656d76;
      --paper: #f6f8fa;
      --panel: #ffffff;
      --soft: #f6f8fa;
      --line: #d0d7de;
      --line-strong: #8c959f;
      --accent: #16824c;
      --accent-dark: #116b3e;
      --accent-soft: #dafbe1;
      --code: #f6f8fa;
      --danger: #cf222e;
      --shadow: none;
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }

    html, body { min-height: 100%; }

    body {
      min-width: 320px;
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Microsoft YaHei", monospace;
    }

    button, textarea, input, select { font: inherit; }

    button:focus-visible, textarea:focus-visible, input:focus-visible, select:focus-visible {
      outline: 3px solid rgba(23, 105, 75, 0.22);
      outline-offset: 2px;
    }

    .shell {
      display: flex;
      width: min(1680px, 100%);
      min-height: 100vh;
      margin: 0 auto;
      padding: 16px clamp(12px, 2vw, 26px) 20px;
      flex-direction: column;
    }

    .masthead {
      display: flex;
      align-items: center;
      gap: 14px;
      margin: 0 2px 14px;
    }

    .home {
      display: inline-grid;
      width: 34px;
      height: 34px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: rgba(255, 254, 251, 0.72);
      color: var(--ink);
      place-items: center;
      text-decoration: none;
    }

    .home:hover { border-color: var(--accent); color: var(--accent); }

    .title-group { min-width: 0; }

    h1 {
      margin: 0;
      font-size: clamp(23px, 2.6vw, 30px);
      font-weight: 780;
      letter-spacing: -0.04em;
      line-height: 1.12;
    }

    h1 span { color: var(--accent); }

    .intro {
      margin: 3px 0 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .privacy {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-left: auto;
      color: var(--muted);
      font-size: 11px;
      white-space: nowrap;
    }

    .privacy::before {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #53a87c;
      box-shadow: 0 0 0 4px rgba(83, 168, 124, 0.14);
      content: "";
    }

    .workspace {
      display: flex;
      min-height: 0;
      flex: 1;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    .toolbar {
      display: flex;
      min-height: 52px;
      padding: 8px 10px;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 254, 251, 0.96);
    }

    .toolbar-group { display: flex; align-items: center; gap: 7px; }
    .toolbar-group.options { margin-left: auto; }

    button, .file-button {
      display: inline-flex;
      min-height: 34px;
      padding: 0 12px;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #fff;
      color: var(--ink);
      cursor: pointer;
      font-size: 12px;
      font-weight: 680;
      line-height: 1;
      transition: border-color 120ms ease, background 120ms ease, transform 120ms ease;
    }

    button:hover, .file-button:hover { border-color: var(--line-strong); background: var(--soft); }
    button:active, .file-button:active { transform: translateY(1px); }
    button:disabled { cursor: not-allowed; opacity: 0.45; }

    .primary { border-color: var(--accent); background: var(--accent); color: #fff; }
    .primary:hover { border-color: var(--accent-dark); background: var(--accent-dark); }
    .quiet { border-color: transparent; background: transparent; color: var(--muted); }
    .quiet:hover { border-color: var(--line); color: var(--ink); }

    .file-button input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }

    .switch {
      display: inline-flex;
      min-height: 32px;
      padding: 0 5px;
      align-items: center;
      gap: 6px;
      color: var(--muted);
      cursor: pointer;
      font-size: 11px;
      font-weight: 650;
      white-space: nowrap;
      user-select: none;
    }

    .switch input { width: 15px; height: 15px; margin: 0; accent-color: var(--accent); }

    .mode-select {
      display: inline-flex;
      min-height: 34px;
      align-items: center;
      gap: 6px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 650;
      white-space: nowrap;
    }

    .mode-select select {
      height: 34px;
      padding: 0 26px 0 9px;
      border: 1px solid var(--line);
      border-radius: 2px;
      background: #fff;
      color: var(--ink);
      cursor: pointer;
      font-size: 11px;
      font-weight: 600;
    }

    .mode-select select:hover { border-color: var(--accent); }

    .panes {
      display: grid;
      min-height: 520px;
      flex: 1;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    }

    .pane { display: flex; min-width: 0; min-height: 0; flex-direction: column; }
    .pane + .pane { border-left: 1px solid var(--line); }

    .pane-head {
      display: flex;
      min-height: 42px;
      padding: 0 10px 0 13px;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid var(--line);
      background: var(--soft);
    }

    .pane-title {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 11px;
      font-weight: 760;
      letter-spacing: 0.055em;
      text-transform: uppercase;
    }

    .dot { width: 7px; height: 7px; border-radius: 50%; background: #d68b3e; }
    .output-pane .dot { background: var(--accent); }
    .stats { margin-left: auto; color: var(--muted); font: 10.5px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace; }

    .tabs { display: flex; margin-left: auto; padding: 3px; border: 1px solid var(--line); border-radius: 7px; background: #fff; }
    .tab { min-height: 27px; padding: 0 10px; border: 0; border-radius: 5px; background: transparent; color: var(--muted); font-size: 11px; }
    .tab:hover { border: 0; background: var(--soft); }
    .tab[aria-selected="true"] { background: var(--accent-soft); color: var(--accent-dark); }

    .editor-wrap { position: relative; display: flex; min-height: 0; flex: 1; }

    #markdown-input, #html-source {
      display: block;
      width: 100%;
      min-height: 100%;
      padding: 20px clamp(16px, 2vw, 24px) 28px;
      resize: none;
      border: 0;
      border-radius: 0;
      background: #fffefb;
      color: var(--ink);
      caret-color: var(--accent);
      font: 13px/1.65 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      tab-size: 2;
    }

    #markdown-input::placeholder { color: #a1a6a2; }
    #markdown-input:focus, #html-source:focus { outline: 0; background: #fff; }
    #html-source { color: #334039; white-space: pre; }

    .drop-overlay {
      display: none;
      position: absolute;
      inset: 10px;
      z-index: 5;
      align-items: center;
      justify-content: center;
      border: 2px dashed var(--accent);
      border-radius: 10px;
      background: rgba(226, 240, 233, 0.94);
      color: var(--accent-dark);
      font-size: 14px;
      font-weight: 740;
      pointer-events: none;
    }

    .editor-wrap.is-dragging .drop-overlay { display: flex; }

    .preview-shell { min-height: 0; flex: 1; overflow: auto; background: #fff; }
    #preview { min-height: 100%; padding: clamp(20px, 3.4vw, 42px); }

    .empty-state {
      display: grid;
      min-height: 100%;
      padding: 36px;
      color: var(--muted);
      place-items: center;
      text-align: center;
    }

    .empty-state strong { display: block; margin-bottom: 5px; color: var(--ink); font-size: 15px; }

    .footer {
      display: flex;
      min-height: 35px;
      padding: 0 12px;
      align-items: center;
      gap: 12px;
      border-top: 1px solid var(--line);
      background: var(--soft);
      color: var(--muted);
      font-size: 10.5px;
    }

    .footer .right { margin-left: auto; }
    .status-ok { color: var(--accent); }
    .status-error { color: var(--danger); }

    .toast {
      position: fixed;
      z-index: 50;
      right: 20px;
      bottom: 20px;
      max-width: min(360px, calc(100vw - 32px));
      padding: 10px 14px;
      border-radius: 8px;
      background: #17231d;
      color: #fff;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.22);
      font-size: 12px;
      opacity: 0;
      pointer-events: none;
      transform: translateY(8px);
      transition: opacity 160ms ease, transform 160ms ease;
    }

    .toast.show { opacity: 1; transform: translateY(0); }

    @media (max-width: 820px) {
      .shell { min-height: auto; padding: 10px 8px 12px; }
      .masthead { margin-bottom: 10px; }
      .privacy { display: none; }
      .toolbar-group.options { width: 100%; margin-left: 0; padding-top: 3px; border-top: 1px solid var(--line); }
      .panes { min-height: 0; grid-template-columns: 1fr; }
      .pane + .pane { min-height: 520px; border-top: 1px solid var(--line); border-left: 0; }
      #markdown-input { min-height: 410px; resize: vertical; }
      .preview-shell, #html-source { min-height: 480px; }
    }

    @media (max-width: 480px) {
      .intro { max-width: 260px; }
      .toolbar { gap: 5px; }
      button, .file-button { padding: 0 9px; }
      .switch { font-size: 10px; }
      #preview { padding: 20px 16px; }
      .footer .shortcut { display: none; }
    }

    .home {
      border-radius: 2px;
      background: #fff;
    }

    h1 {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 23px;
      font-weight: 700;
      letter-spacing: -0.04em;
    }

    h1::before { color: var(--accent); content: ">_ "; }
    .intro { font-size: 11px; }

    .privacy::before {
      width: 6px;
      height: 6px;
      border-radius: 0;
      background: var(--accent);
      box-shadow: none;
    }

    .workspace { border-radius: 2px; box-shadow: none; }
    .toolbar { background: #f6f8fa; }

    button, .file-button {
      border-radius: 2px;
      background: #fff;
      color: var(--ink);
      font-family: inherit;
      font-weight: 600;
    }

    button:hover, .file-button:hover { border-color: var(--accent); background: #eef1f4; color: var(--accent-dark); }
    .primary { border-color: var(--accent); background: var(--accent); color: #fff; }
    .primary:hover { border-color: var(--accent-dark); background: var(--accent-dark); color: #fff; }
    .quiet:hover { background: #eef1f4; color: var(--accent-dark); }

    .pane-head, .footer { background: #f6f8fa; }
    .dot { border-radius: 0; background: #bf8700; }
    .output-pane .dot { background: var(--accent); }

    .tabs { padding: 2px; border-radius: 2px; background: #fff; }
    .tab { border-radius: 1px; }
    .tab[aria-selected="true"] { background: var(--accent); color: #fff; }

    #markdown-input, #html-source,
    #markdown-input:focus, #html-source:focus {
      background: var(--panel);
      color: var(--ink);
    }

    #markdown-input::placeholder { color: #8c959f; }
    #html-source { color: #424a53; }
    .drop-overlay { border-radius: 2px; background: rgba(218, 251, 225, 0.96); color: var(--accent-dark); }
    .preview-shell { background: var(--panel); }

    .toast {
      border: 1px solid var(--accent);
      border-radius: 2px;
      background: #fff;
      color: var(--accent-dark);
      box-shadow: none;
    }
  </style>
  <style id="markdown-style">
    .md-body {
      color: #242b27;
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      font-size: 15px;
      line-height: 1.72;
      overflow-wrap: break-word;
    }

    .md-body > :first-child { margin-top: 0 !important; }
    .md-body > :last-child { margin-bottom: 0 !important; }
    .md-body h1, .md-body h2, .md-body h3, .md-body h4, .md-body h5, .md-body h6 {
      margin: 1.55em 0 0.65em;
      color: #17201b;
      font-weight: 750;
      letter-spacing: -0.025em;
      line-height: 1.28;
    }
    .md-body h1 { padding-bottom: 0.32em; border-bottom: 1px solid #dddeda; font-size: 2em; }
    .md-body h2 { padding-bottom: 0.28em; border-bottom: 1px solid #e5e6e2; font-size: 1.52em; }
    .md-body h3 { font-size: 1.26em; }
    .md-body h4 { font-size: 1.08em; }
    .md-body p, .md-body blockquote, .md-body ul, .md-body ol, .md-body dl, .md-body table, .md-body pre, .md-body details { margin: 0 0 1em; }
    .md-body a { color: #126848; text-decoration-thickness: 1px; text-underline-offset: 0.18em; }
    .md-body a:hover { color: #0b4932; }
    .md-body strong { color: #17201b; font-weight: 720; }
    .md-body hr { height: 1px; margin: 2em 0; border: 0; background: #dddeda; }
    .md-body blockquote { padding: 0.15em 1em; border-left: 3px solid #63a286; color: #58615c; }
    .md-body blockquote > :last-child { margin-bottom: 0; }
    .md-body ul, .md-body ol { padding-left: 1.55em; }
    .md-body li + li { margin-top: 0.28em; }
    .md-body li > p { margin-bottom: 0.45em; }
    .md-body input[type="checkbox"] { margin: 0 0.45em 0.2em -1.35em; accent-color: #17694b; vertical-align: middle; }
    .md-body code {
      padding: 0.16em 0.38em;
      border: 1px solid #e0e2de;
      border-radius: 4px;
      background: #f3f4f2;
      color: #ad3e2f;
      font: 0.88em/1.45 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
    .md-body pre {
      position: relative;
      padding: 1em 1.08em;
      overflow: auto;
      border: 1px solid #dfe2de;
      border-radius: 8px;
      background: #f6f7f5;
      color: #27302b;
      line-height: 1.58;
      tab-size: 2;
    }
    .md-body pre code { padding: 0; border: 0; background: transparent; color: inherit; font-size: 0.86em; }
    .md-body .code-lang { display: block; margin: -0.2em 0 0.7em; color: #818a84; font: 10px/1 ui-monospace, monospace; letter-spacing: 0.08em; text-transform: uppercase; }
    .md-body table { display: block; width: max-content; max-width: 100%; overflow: auto; border-spacing: 0; border-collapse: collapse; }
    .md-body th, .md-body td { padding: 0.55em 0.75em; border: 1px solid #dfe1dd; text-align: left; }
    .md-body th { background: #f2f4f1; color: #1c2620; font-weight: 700; }
    .md-body tr:nth-child(even) td { background: #fafbf9; }
    .md-body img { max-width: 100%; height: auto; border-radius: 6px; }
    .md-body details { padding: 0.7em 0.85em; border: 1px solid #dfe1dd; border-radius: 7px; }
    .md-body summary { cursor: pointer; font-weight: 680; }
    .md-body kbd { padding: 0.12em 0.38em; border: 1px solid #cdd0cc; border-bottom-width: 2px; border-radius: 4px; background: #f7f8f6; font: 0.82em ui-monospace, monospace; }
    .md-body .hljs-keyword, .md-body .hljs-selector-tag, .md-body .hljs-literal { color: #8b3bb0; }
    .md-body .hljs-string, .md-body .hljs-regexp { color: #397a35; }
    .md-body .hljs-number, .md-body .hljs-symbol { color: #b75723; }
    .md-body .hljs-title, .md-body .hljs-section, .md-body .hljs-function { color: #245eb0; }
    .md-body .hljs-comment, .md-body .hljs-quote { color: #7c8580; font-style: italic; }
    .md-body .hljs-attr, .md-body .hljs-attribute { color: #9b542a; }
    .md-body .hljs-built_in, .md-body .hljs-type { color: #1b7980; }
    .md-body .language-diff .hljs-addition { display: inline-block; width: 100%; background: #e4f3e9; color: #23673c; }
    .md-body .language-diff .hljs-deletion { display: inline-block; width: 100%; background: #f7e7e4; color: #9b3f34; }

    .md-body {
      background: #fff;
      color: #1f2328;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Microsoft YaHei", monospace;
      font-size: 14px;
    }

    .md-body h1, .md-body h2, .md-body h3, .md-body h4, .md-body h5, .md-body h6 {
      color: #1f2328;
      font-family: inherit;
      font-weight: 700;
      letter-spacing: -0.035em;
    }

    .md-body h1, .md-body h2 { border-bottom-color: #d0d7de; }
    .md-body a, .md-body a:hover { color: #16824c; }
    .md-body strong { color: #1f2328; }
    .md-body hr { background: #d0d7de; }
    .md-body blockquote { border-left-color: #16824c; color: #656d76; }
    .md-body input[type="checkbox"] { accent-color: #16824c; }

    .md-body code {
      border-color: #d0d7de;
      border-radius: 2px;
      background: #f6f8fa;
      color: #cf222e;
    }

    .md-body pre {
      border-color: #d0d7de;
      border-radius: 2px;
      background: #f6f8fa;
      color: #1f2328;
    }

    .md-body .code-lang { color: #656d76; }
    .md-body th, .md-body td { border-color: #d0d7de; }
    .md-body th { background: #f6f8fa; color: #1f2328; }
    .md-body tr:nth-child(even) td { background: #f6f8fa; }
    .md-body img, .md-body details, .md-body kbd { border-radius: 2px; }
    .md-body details { border-color: #d0d7de; }
    .md-body kbd { border-color: #afb8c1; background: #f6f8fa; }
    .md-body .hljs-keyword, .md-body .hljs-selector-tag, .md-body .hljs-literal { color: #cf222e; }
    .md-body .hljs-string, .md-body .hljs-regexp { color: #0a3069; }
    .md-body .hljs-number, .md-body .hljs-symbol { color: #0550ae; }
    .md-body .hljs-title, .md-body .hljs-section, .md-body .hljs-function { color: #8250df; }
    .md-body .hljs-comment, .md-body .hljs-quote { color: #6e7781; }
    .md-body .hljs-attr, .md-body .hljs-attribute { color: #116329; }
    .md-body .hljs-built_in, .md-body .hljs-type { color: #953800; }
    .md-body .language-diff .hljs-addition { background: #e6ffec; color: #13743f; }
    .md-body .language-diff .hljs-deletion { background: #ffebe9; color: #b4232f; }
  </style>
</head>
<body>
  <main class="shell">
    <header class="masthead">
      <a class="home" href="/" aria-label="返回工具首页" title="返回工具首页">←</a>
      <div class="title-group">
        <h1><span>Markdown</span> 转 HTML</h1>
        <p class="intro">标准 Markdown、GFM，以及 Cursor / Codex 常见输出格式</p>
      </div>
      <span class="privacy">内容仅在本地浏览器处理</span>
    </header>

    <section class="workspace" aria-label="Markdown 转换工作区">
      <div class="toolbar">
        <div class="toolbar-group">
          <label class="file-button" title="导入 .md 或 .txt 文件">
            导入文件
            <input id="file-input" type="file" accept=".md,.markdown,.mdown,.mkd,.txt,text/markdown,text/plain">
          </label>
          <button id="sample-button" type="button">示例</button>
          <button id="clear-button" class="quiet" type="button">清空</button>
        </div>
        <div class="toolbar-group options">
          <label class="switch" title="将单个换行转换为换行标签">
            <input id="breaks-option" type="checkbox">
            保留单换行
          </label>
          <label class="mode-select" for="output-mode" title="选择生成 HTML 片段或可以独立打开的完整页面">
            <span>输出模式</span>
            <select id="output-mode">
              <option value="fragment">HTML 片段</option>
              <option value="document">完整页面（head + body）</option>
            </select>
          </label>
          <button id="copy-button" class="primary" type="button" disabled>复制 HTML</button>
          <button id="download-button" type="button" disabled>下载</button>
        </div>
      </div>

      <div class="panes">
        <section class="pane input-pane">
          <div class="pane-head">
            <span class="pane-title"><span class="dot"></span>Markdown</span>
            <span id="input-stats" class="stats">0 字符 · 0 行</span>
          </div>
          <div id="editor-wrap" class="editor-wrap">
            <textarea id="markdown-input" aria-label="Markdown 输入" spellcheck="false" placeholder="在这里粘贴 Markdown…&#10;&#10;支持标题、表格、任务列表、代码块、引用、链接和内嵌 HTML。"></textarea>
            <div class="drop-overlay">松开以导入 Markdown 文件</div>
          </div>
        </section>

        <section class="pane output-pane">
          <div class="pane-head">
            <span class="pane-title"><span class="dot"></span>结果</span>
            <div class="tabs" role="tablist" aria-label="结果视图">
              <button id="preview-tab" class="tab" type="button" role="tab" aria-selected="true" aria-controls="preview-shell">预览</button>
              <button id="source-tab" class="tab" type="button" role="tab" aria-selected="false" aria-controls="html-source">HTML</button>
            </div>
          </div>
          <div id="preview-shell" class="preview-shell" role="tabpanel" aria-labelledby="preview-tab">
            <article id="preview" class="md-body">
              <div class="empty-state"><div><strong>等待 Markdown</strong>粘贴内容后会在这里实时预览</div></div>
            </article>
          </div>
          <textarea id="html-source" role="tabpanel" aria-labelledby="source-tab" aria-label="生成的 HTML" readonly hidden></textarea>
        </section>
      </div>

      <footer class="footer">
        <span id="render-status" class="status-ok">转换器准备中…</span>
        <span class="shortcut">⌘/Ctrl + Enter 转换 · Tab 缩进</span>
        <span id="output-stats" class="right">0 B HTML</span>
      </footer>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/marked@16.2.1/lib/marked.umd.min.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script>
    (() => {
      const elements = {
        input: document.querySelector('#markdown-input'),
        source: document.querySelector('#html-source'),
        preview: document.querySelector('#preview'),
        previewShell: document.querySelector('#preview-shell'),
        previewTab: document.querySelector('#preview-tab'),
        sourceTab: document.querySelector('#source-tab'),
        fileInput: document.querySelector('#file-input'),
        editorWrap: document.querySelector('#editor-wrap'),
        sample: document.querySelector('#sample-button'),
        clear: document.querySelector('#clear-button'),
        copy: document.querySelector('#copy-button'),
        download: document.querySelector('#download-button'),
        breaks: document.querySelector('#breaks-option'),
        outputMode: document.querySelector('#output-mode'),
        inputStats: document.querySelector('#input-stats'),
        outputStats: document.querySelector('#output-stats'),
        status: document.querySelector('#render-status'),
        toast: document.querySelector('#toast')
      };

      const SAMPLE = [
        '# AI 编程助手交付说明',
        '',
        '> 这是一份兼容 **Cursor**、**Codex** 和标准 GFM 的示例文档。',
        '',
        '## 本次改动',
        '',
        '- [x] 支持实时 Markdown 预览',
        '- [x] 支持表格与任务列表',
        '- [ ] 提交前运行完整测试',
        '',
        '| 文件 | 状态 | 说明 |',
        '| --- | :---: | --- |',
        '| `src/app.ts` | 已修改 | 增加转换入口 |',
        '| `README.md` | 待更新 | 补充使用说明 |',
        '',
        '## 代码示例',
        '',
        '```typescript',
        'type Result = { html: string; warnings: string[] };',
        '',
        'export function convert(markdown: string): Result {',
        '  return { html: render(markdown), warnings: [] };',
        '}',
        '```',
        '',
        '```diff',
        '- const safe = false;',
        '+ const safe = true;',
        '```',
        '',
        '## 注意事项',
        '',
        '1. 原始 HTML 会经过安全清理。',
        '2. 外部链接会在新标签页打开。',
        '3. 转换结果可复制为片段，也可导出完整 HTML 文档。',
        '',
        '<details>',
        '<summary>查看补充信息</summary>',
        '',
        '内嵌的安全 HTML 标签也可以正常展示。',
        '',
        '</details>'
      ].join('\n');

      let fragmentHTML = '';
      let outputHTML = '';
      let renderTimer;
      let toastTimer;

      const escapeHTML = (value) => String(value)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');

      function showToast(message) {
        clearTimeout(toastTimer);
        elements.toast.textContent = message;
        elements.toast.classList.add('show');
        toastTimer = setTimeout(() => elements.toast.classList.remove('show'), 1800);
      }

      function byteSize(value) {
        const bytes = new Blob([value]).size;
        if (bytes < 1024) return `${bytes} B`;
        return `${(bytes / 1024).toFixed(bytes < 10240 ? 1 : 0)} KB`;
      }

      function updateStats(markdown) {
        const lines = markdown ? markdown.split('\n').length : 0;
        elements.inputStats.textContent = `${markdown.length.toLocaleString()} 字符 · ${lines.toLocaleString()} 行`;
        elements.outputStats.textContent = `${byteSize(outputHTML)} HTML`;
      }

      function buildDocument(content) {
        const style = document.querySelector('#markdown-style').textContent;
        return [
          '<!doctype html>',
          '<html lang="zh-CN">',
          '<head>',
          '  <meta charset="utf-8">',
          '  <meta name="viewport" content="width=device-width, initial-scale=1">',
          '  <title>Markdown 文档</title>',
          `  <style>${style}</style>`,
          '</head>',
          '<body class="md-body">',
          content,
          '</body>',
          '</html>'
        ].join('\n');
      }

      function refreshOutputMode() {
        outputHTML = elements.outputMode.value === 'document' && fragmentHTML ? buildDocument(fragmentHTML) : fragmentHTML;
        elements.source.value = outputHTML;
        elements.outputStats.textContent = `${byteSize(outputHTML)} HTML`;
      }

      function createRenderer() {
        const renderer = new marked.Renderer();
        renderer.code = (tokenOrCode, infoString) => {
          const token = typeof tokenOrCode === 'object' ? tokenOrCode : { text: tokenOrCode, lang: infoString };
          const code = token.text || '';
          const requestedLanguage = String(token.lang || '').trim().split(/\s+/)[0].toLowerCase();
          let highlighted = escapeHTML(code);
          let language = requestedLanguage;

          if (window.hljs) {
            try {
              if (language && hljs.getLanguage(language)) {
                highlighted = hljs.highlight(code, { language }).value;
              } else if (code.trim()) {
                const detected = hljs.highlightAuto(code);
                highlighted = detected.value;
                language = language || detected.language || '';
              }
            } catch (error) {
              highlighted = escapeHTML(code);
            }
          }

          const className = language ? ` class="hljs language-${escapeHTML(language)}"` : ' class="hljs"';
          const label = requestedLanguage ? `<span class="code-lang">${escapeHTML(requestedLanguage)}</span>` : '';
          return `<pre>${label}<code${className}>${highlighted}</code></pre>\n`;
        };
        return renderer;
      }

      function secureLinks(container) {
        container.querySelectorAll('a[href]').forEach((link) => {
          const href = link.getAttribute('href') || '';
          if (/^https?:\/\//i.test(href)) {
            link.target = '_blank';
            link.rel = 'noopener noreferrer';
          }
        });
      }

      function render() {
        const markdown = elements.input.value;
        elements.clear.disabled = !markdown;

        if (!markdown.trim()) {
          fragmentHTML = '';
          outputHTML = '';
          elements.preview.innerHTML = '<div class="empty-state"><div><strong>等待 Markdown</strong>粘贴内容后会在这里实时预览</div></div>';
          elements.source.value = '';
          elements.copy.disabled = true;
          elements.download.disabled = true;
          elements.status.textContent = '等待输入';
          elements.status.className = 'status-ok';
          updateStats('');
          return;
        }

        if (!window.marked || !window.DOMPurify) {
          elements.status.textContent = '转换组件加载失败，请检查网络后刷新页面';
          elements.status.className = 'status-error';
          elements.copy.disabled = true;
          elements.download.disabled = true;
          updateStats(markdown);
          return;
        }

        try {
          const rendered = marked.parse(markdown, {
            gfm: true,
            breaks: elements.breaks.checked,
            async: false,
            renderer: createRenderer()
          });
          fragmentHTML = DOMPurify.sanitize(rendered, {
            USE_PROFILES: { html: true },
            ADD_TAGS: ['details', 'summary', 'kbd'],
            ADD_ATTR: ['target', 'rel', 'class', 'checked', 'disabled']
          });
          elements.preview.innerHTML = fragmentHTML;
          secureLinks(elements.preview);
          fragmentHTML = elements.preview.innerHTML;
          refreshOutputMode();
          elements.copy.disabled = false;
          elements.download.disabled = false;
          elements.status.textContent = '已安全转换';
          elements.status.className = 'status-ok';
          updateStats(markdown);
        } catch (error) {
          elements.status.textContent = `转换失败：${error && error.message ? error.message : '未知错误'}`;
          elements.status.className = 'status-error';
          elements.copy.disabled = true;
          elements.download.disabled = true;
          updateStats(markdown);
        }
      }

      function scheduleRender() {
        clearTimeout(renderTimer);
        renderTimer = setTimeout(render, 90);
      }

      function setResultTab(tab) {
        const showPreview = tab === 'preview';
        elements.previewTab.setAttribute('aria-selected', String(showPreview));
        elements.sourceTab.setAttribute('aria-selected', String(!showPreview));
        elements.previewShell.hidden = !showPreview;
        elements.source.hidden = showPreview;
      }

      async function copyHTML() {
        if (!outputHTML) return;
        try {
          await navigator.clipboard.writeText(outputHTML);
          showToast(elements.outputMode.value === 'document' ? '已复制完整 HTML 页面' : '已复制 HTML 片段');
        } catch (error) {
          setResultTab('source');
          elements.source.select();
          document.execCommand('copy');
          showToast('已复制 HTML');
        }
      }

      function downloadHTML() {
        if (!outputHTML) return;
        const blob = new Blob([outputHTML], { type: 'text/html;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const anchor = document.createElement('a');
        anchor.href = url;
        anchor.download = elements.outputMode.value === 'document' ? 'markdown-page.html' : 'markdown-fragment.html';
        anchor.click();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
        showToast('HTML 文件已下载');
      }

      function loadFile(file) {
        if (!file) return;
        const isMarkdown = /\.(md|markdown|mdown|mkd|txt)$/i.test(file.name) || /^(text\/markdown|text\/plain)$/.test(file.type);
        if (!isMarkdown) {
          showToast('请选择 Markdown 或纯文本文件');
          return;
        }
        if (file.size > 5 * 1024 * 1024) {
          showToast('文件不能超过 5 MB');
          return;
        }
        const reader = new FileReader();
        reader.onload = () => {
          elements.input.value = String(reader.result || '');
          render();
          showToast(`已导入 ${file.name}`);
        };
        reader.onerror = () => showToast('文件读取失败');
        reader.readAsText(file);
      }

      elements.input.addEventListener('input', scheduleRender);
      elements.input.addEventListener('keydown', (event) => {
        if (event.key === 'Tab') {
          event.preventDefault();
          const start = elements.input.selectionStart;
          const end = elements.input.selectionEnd;
          elements.input.setRangeText('  ', start, end, 'end');
          scheduleRender();
        }
        if ((event.metaKey || event.ctrlKey) && event.key === 'Enter') {
          event.preventDefault();
          clearTimeout(renderTimer);
          render();
        }
      });

      elements.breaks.addEventListener('change', render);
      elements.outputMode.addEventListener('change', refreshOutputMode);
      elements.previewTab.addEventListener('click', () => setResultTab('preview'));
      elements.sourceTab.addEventListener('click', () => setResultTab('source'));
      elements.copy.addEventListener('click', copyHTML);
      elements.download.addEventListener('click', downloadHTML);
      elements.sample.addEventListener('click', () => {
        elements.input.value = SAMPLE;
        render();
        elements.input.focus();
        elements.input.setSelectionRange(0, 0);
      });
      elements.clear.addEventListener('click', () => {
        elements.input.value = '';
        render();
        elements.input.focus();
      });
      elements.fileInput.addEventListener('change', () => {
        loadFile(elements.fileInput.files[0]);
        elements.fileInput.value = '';
      });

      ['dragenter', 'dragover'].forEach((eventName) => {
        elements.editorWrap.addEventListener(eventName, (event) => {
          event.preventDefault();
          elements.editorWrap.classList.add('is-dragging');
        });
      });
      ['dragleave', 'drop'].forEach((eventName) => {
        elements.editorWrap.addEventListener(eventName, (event) => {
          event.preventDefault();
          elements.editorWrap.classList.remove('is-dragging');
          if (eventName === 'drop') loadFile(event.dataTransfer.files[0]);
        });
      });

      render();
    })();
  </script>
</body>
</html>
