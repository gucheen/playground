<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="在浏览器本地进行 Base64 编码和解码。">
  <title>Base64 编码 / 解码</title>
  <style>
    * { box-sizing: border-box; }
    body { max-width: 1000px; margin: 28px auto; padding: 0 16px; color: #202124; font-family: sans-serif; line-height: 1.5; }
    header { display: flex; align-items: baseline; gap: 14px; margin-bottom: 18px; }
    h1 { margin: 0; font-size: 26px; }
    a { color: #146c43; }
    .hint, .status { color: #666; font-size: 14px; }
    .workspace { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 12px; align-items: center; }
    .field { min-width: 0; }
    .field-head { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
    label { font-weight: 650; }
    textarea { width: 100%; min-height: 330px; padding: 10px; resize: vertical; border: 1px solid #bbb; border-radius: 6px; font: 14px/1.55 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    textarea:focus, button:focus-visible { outline: 3px solid rgba(20, 108, 67, 0.2); outline-offset: 1px; }
    .actions { display: flex; flex-direction: column; gap: 8px; }
    button { min-height: 36px; padding: 0 12px; border: 1px solid #aaa; border-radius: 6px; background: #fff; cursor: pointer; font: inherit; white-space: nowrap; }
    button:hover { background: #f5f5f5; }
    button.primary { border-color: #146c43; background: #146c43; color: #fff; }
    button.primary:hover { background: #0f5736; }
    .footer { display: flex; justify-content: space-between; gap: 12px; margin-top: 10px; }
    .status.error { color: #b42318; }
    @media (max-width: 700px) {
      body { margin-top: 16px; }
      header { align-items: flex-start; flex-direction: column; gap: 2px; }
      .workspace { grid-template-columns: 1fr; }
      .actions { flex-direction: row; flex-wrap: wrap; }
      textarea { min-height: 210px; }
    }
  </style>
  <link rel="stylesheet" href="theme.css?v=c980c37d302d">
</head>
<body class="pg-base64">
  <header>
    <h1>Base64 编码 / 解码</h1>
    <a href="/">返回工具箱</a>
  </header>
  <p class="hint">支持中文和 Emoji；内容只在当前浏览器中处理。</p>

  <main class="workspace">
    <section class="field">
      <div class="field-head">
        <label for="plain-text">原始文本</label>
        <span id="plain-count" class="hint">0 字符</span>
      </div>
      <textarea id="plain-text" spellcheck="false" placeholder="输入要编码的文本"></textarea>
    </section>

    <div class="actions" aria-label="转换操作">
      <button id="encode" class="primary" type="button">编码 →</button>
      <button id="decode" type="button">← 解码</button>
    </div>

    <section class="field">
      <div class="field-head">
        <label for="base64-text">Base64</label>
        <span id="base64-count" class="hint">0 字符</span>
      </div>
      <textarea id="base64-text" spellcheck="false" autocapitalize="off" placeholder="输入要解码的 Base64"></textarea>
    </section>
  </main>

  <div class="footer">
    <span id="status" class="status" role="status" aria-live="polite">等待输入</span>
    <span>
      <button id="copy" type="button">复制结果</button>
      <button id="clear" type="button">清空</button>
    </span>
  </div>

  <script>
    (() => {
      const plain = document.querySelector('#plain-text');
      const base64 = document.querySelector('#base64-text');
      const plainCount = document.querySelector('#plain-count');
      const base64Count = document.querySelector('#base64-count');
      const status = document.querySelector('#status');
      let lastResult = null;

      function updateCounts() {
        plainCount.textContent = `${Array.from(plain.value).length} 字符`;
        base64Count.textContent = `${base64.value.length} 字符`;
      }

      function setStatus(message, isError = false) {
        status.textContent = message;
        status.classList.toggle('error', isError);
      }

      function encodeText(text) {
        const bytes = new TextEncoder().encode(text);
        let binary = '';
        const chunkSize = 0x8000;
        for (let index = 0; index < bytes.length; index += chunkSize) {
          binary += String.fromCharCode(...bytes.subarray(index, index + chunkSize));
        }
        return btoa(binary);
      }

      function decodeText(value) {
        const normalized = value.replace(/\s/g, '').replace(/-/g, '+').replace(/_/g, '/');
        if (!normalized) return '';
        if (normalized.length % 4 === 1 || !/^[A-Za-z0-9+/]*={0,2}$/.test(normalized)) {
          throw new Error('invalid-base64');
        }
        const padded = normalized.padEnd(Math.ceil(normalized.length / 4) * 4, '=');
        const binary = atob(padded);
        const bytes = Uint8Array.from(binary, (character) => character.charCodeAt(0));
        return new TextDecoder('utf-8', { fatal: true }).decode(bytes);
      }

      document.querySelector('#encode').addEventListener('click', () => {
        base64.value = encodeText(plain.value);
        lastResult = base64;
        updateCounts();
        setStatus(plain.value ? '编码完成' : '已得到空结果');
      });

      document.querySelector('#decode').addEventListener('click', () => {
        try {
          plain.value = decodeText(base64.value);
          lastResult = plain;
          updateCounts();
          setStatus(base64.value ? '解码完成' : '已得到空结果');
        } catch {
          setStatus('无法解码：请检查 Base64 内容是否完整且为 UTF-8 文本。', true);
        }
      });

      document.querySelector('#copy').addEventListener('click', async () => {
        const target = lastResult || (base64.value ? base64 : plain);
        if (!target.value) {
          setStatus('没有可复制的内容', true);
          return;
        }
        try {
          await navigator.clipboard.writeText(target.value);
          setStatus('结果已复制');
        } catch {
          target.focus();
          target.select();
          setStatus('无法自动复制，已为你选中结果。', true);
        }
      });

      document.querySelector('#clear').addEventListener('click', () => {
        plain.value = '';
        base64.value = '';
        lastResult = null;
        updateCounts();
        setStatus('已清空');
        plain.focus();
      });

      plain.addEventListener('input', () => { lastResult = null; updateCounts(); });
      base64.addEventListener('input', () => { lastResult = null; updateCounts(); });
    })();
  </script>
</body>
</html>
